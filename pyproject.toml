[build-system]
requires = ["setuptools>=61.0", "cffi>=2.0.0", "wheel>=0.38.0"]
build-backend = "setuptools.build_meta"

[project]
name = "icegrams"
version = "2.0.0"
description = "Trigram statistics for Icelandic"
authors = [{ name = "Miðeind ehf.", email = "mideind@mideind.is" }]
maintainers = [{ name = "Miðeind ehf.", email = "mideind@mideind.is" }]
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE.txt"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Natural Language :: Icelandic",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    # Free-threaded wheels are published for CPython 3.14t and 3.15t
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Topic :: Text Processing :: Linguistic",
]
keywords = ["nlp", "trigram", "ngram", "trigrams", "ngrams", "icelandic"]
requires-python = ">=3.10"
# cffi 2.0 is the first that runs free-threaded Python without the GIL
dependencies = ["cffi>=2.0.0", "certifi"]

[project.urls]
Repository = "https://github.com/mideind/Icegrams"

[project.optional-dependencies]
# dev dependencies
dev = ["pytest", "ruff", "setuptools"]

# *** Configuration of tools ***

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
icegrams = ["py.typed"]

[tool.pytest.ini_options]
filterwarnings = [
    # Ignore deprecation warnings in libraries, their problem not ours
    # "ignore::DeprecationWarning",
]
# pytest-run-parallel (used on free-threaded Python in CI) runs these tests only once
markers = ["thread_unsafe: the test starts threads of its own"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Explicit rule selection (pycodestyle errors + pyflakes)
select = ["E4", "E7", "E9", "F"]

[tool.isort]
# This forces these imports to placed at the top
known_future_library = ["typing"]
line_length = 88
