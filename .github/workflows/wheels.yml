name: wheels

on:
  push:
    tags:
      - '**'
      # Model releases (tags like model-2026.08) only carry the
      # trigrams.bin asset and don't produce a package release
      - '!model-*'

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-14, ubuntu-26.04]

    steps:
      - uses: actions/checkout@v7

      # Python used to run cibuildwheel
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install cibuildwheel
        run: python -m pip install --upgrade pip wheel setuptools cibuildwheel

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        # Options (https://cibuildwheel.readthedocs.io/en/stable/options/)
        env:
          # Build abi3 wheel for CPython 3.9+ (one wheel for all versions)
          # Build version-specific wheels for free-threaded CPython and PyPy
          # (neither supports abi3)
          CIBW_BUILD: cp39-* cp314t-* cp315t-* pp311-*
          CIBW_SKIP: "*musllinux*"
          CIBW_ENABLE: pypy
          CIBW_PROJECT_REQUIRES_PYTHON: ">=3.9"
          CIBW_BEFORE_BUILD_MACOS: python3 -m pip install --upgrade setuptools wheel cffi
          CIBW_BEFORE_BUILD_WINDOWS: python -m pip install --upgrade setuptools wheel cffi
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_BUILD_FRONTEND: "build"
          # The extension must import, and on free-threaded Python keep the GIL off
          CIBW_TEST_COMMAND: >-
            python -c "import sys, sysconfig, icegrams._trie;
            assert not (sysconfig.get_config_var('Py_GIL_DISABLED') and sys._is_gil_enabled())"

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  # Build source distribution
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Build sdist
        run: |
          python -m pip install build
          python -m build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  # Publish to PyPI (only for version tags)
  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-26.04
    # Only publish on version tags (e.g., 1.2.3)
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref, 'test')
    environment:
      name: pypi
      url: https://pypi.org/project/icegrams/
    permissions:
      id-token: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/
          pattern: dist-*
          merge-multiple: true

      - name: List distributions
        run: ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
