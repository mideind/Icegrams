name: tests

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: true
      matrix:
        # The same versions as mideind/BinPackage: CPython 3.10+, free-threaded
        # 3.14t and 3.15t, and the PyPy versions that get wheels (wheels.yml)
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "3.14t", "3.15t", "pypy-3.11", "pypy-3.12"]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    # The trigram model is fetched by an explicit download step (below)
    # and cached between runs, keyed by the model release tag
    - name: Determine the model release tag
      id: model
      run: |
        TAG=$(sed -n 's/^MODEL_RELEASE_TAG = "\(.*\)"/\1/p' src/icegrams/model.py)
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
    - name: Cache the trigrams model
      uses: actions/cache@v6
      with:
        path: ~/.cache/icegrams
        key: icegrams-${{ steps.model.outputs.tag }}
    - name: Lint with ruff
      run: |
        python -m pip install uv
        uv pip install --system ruff
        ruff check src/icegrams
    - name: Install dependencies
      run: |
        uv pip install --system --upgrade wheel setuptools pytest packaging
        uv pip install --system -e .
    - name: Download the trigrams model
      run: |
        python -m icegrams.download
    - name: Test with pytest
      run: |
        python -m pytest
    # Free-threaded builds: run every test in several threads at once
    - name: Test with pytest in parallel threads
      if: endsWith(matrix.python-version, 't')
      run: |
        uv pip install --system pytest-run-parallel
        python -m pytest --parallel-threads=8
