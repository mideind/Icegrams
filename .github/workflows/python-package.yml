name: tests

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.9", "3.13", "3.14", "pypy-3.11"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    # The trigram model is fetched by an explicit download step (below)
    # and cached between runs, keyed by the model release tag
    - name: Determine the model release tag
      id: model
      run: |
        TAG=$(sed -n 's/^MODEL_RELEASE_TAG = "\(.*\)"/\1/p' src/icegrams/model.py)
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
    - name: Cache the trigrams model
      uses: actions/cache@v4
      with:
        path: ~/.cache/icegrams
        key: icegrams-${{ steps.model.outputs.tag }}
    - name: Lint with ruff
      run: |
        python -m pip install uv
        uv pip install --system ruff
        ruff check src/icegrams
    - name: Install dependencies
      run: |
        uv pip install --system --upgrade wheel setuptools pytest packaging
        uv pip install --system -e .
    - name: Download the trigrams model
      run: |
        python -m icegrams.download
    - name: Test with pytest
      run: |
        python -m pytest
