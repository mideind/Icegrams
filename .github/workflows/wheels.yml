name: wheels

on:
  push:
    tags:
      - '**'
      # Model releases (tags like model-2026.08) only carry the
      # trigrams.bin asset and don't produce a package release
      - '!model-*'

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # ubuntu-26.04-arm builds the Linux aarch64 wheels
        os: [windows-latest, macos-14, ubuntu-26.04, ubuntu-26.04-arm]

    # Options (https://cibuildwheel.readthedocs.io/en/stable/options/)
    env:
      # Build abi3 wheel for CPython 3.10+ (one wheel for all versions)
      # and version-specific wheels for free-threaded CPython and PyPy
      # (neither supports abi3)
      CIBW_SKIP: "*musllinux*"
      CIBW_ENABLE: pypy
      CIBW_PROJECT_REQUIRES_PYTHON: ">=3.10"
      CIBW_BEFORE_BUILD_MACOS: python3 -m pip install --upgrade setuptools wheel cffi
      CIBW_BEFORE_BUILD_WINDOWS: python -m pip install --upgrade setuptools wheel cffi
      CIBW_ARCHS_MACOS: "x86_64 arm64"
      CIBW_ARCHS_WINDOWS: "AMD64"
      # x86_64 on ubuntu-26.04, aarch64 on ubuntu-26.04-arm
      CIBW_ARCHS_LINUX: "native"
      CIBW_BUILD_FRONTEND: "build"
      # The extension must import, and on free-threaded Python keep the GIL off
      CIBW_TEST_COMMAND: >-
        python -c "import sys, sysconfig, icegrams._trie;
        assert not (sysconfig.get_config_var('Py_GIL_DISABLED') and sys._is_gil_enabled())"

    steps:
      - uses: actions/checkout@v7

      # Python used to run cibuildwheel
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install cibuildwheel
        run: python -m pip install --upgrade pipx

      # cibuildwheel 4.3 builds PyPy 3.11 as PyPy 8.0 (ABI pp80) and adds
      # PyPy 3.12 (pp80 too)
      - name: Build wheels (CPython abi3 and free-threaded, PyPy 8.0)
        run: pipx run --spec cibuildwheel==4.3.1 cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: cp310-* cp314t-* cp315t-* pp311-* pp312-*

      # cibuildwheel 4.2 builds PyPy 3.11 as PyPy 7.3 (ABI pp73). pip picks
      # the newest icegrams even if it has to build it from source, so
      # keep these wheels for the users of PyPy 7.3.
      - name: Build wheels (PyPy 7.3)
        run: pipx run --spec cibuildwheel==4.2.1 cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: pp311-*

      # cibuildwheel fails only if a build selector matches nothing at all,
      # so check that every expected wheel was built for every architecture
      - name: Check that every expected wheel was built
        shell: bash
        run: |
          ls -lh wheelhouse
          python - <<'PY'
          import collections, glob, os, sys
          expected = {
              "cp310-abi3", "cp314-cp314t", "cp315-cp315t",
              "pp311-pypy311_pp73", "pp311-pypy311_pp80", "pp312-pypy312_pp80",
          }
          archs = {"Linux": 1, "macOS": 2, "Windows": 1}[os.environ["RUNNER_OS"]]
          found = collections.defaultdict(set)
          for w in glob.glob("wheelhouse/*.whl"):
              _, _, py, abi, plat = os.path.basename(w)[: -len(".whl")].split("-")
              arch = next(a for a in ("x86_64", "aarch64", "arm64", "amd64") if plat.endswith(a))
              found[arch].add(f"{py}-{abi}")
          ok = len(found) == archs
          for arch, tags in sorted(found.items()):
              if tags != expected:
                  ok = False
                  print(f"{arch}: missing {sorted(expected - tags)}, unexpected {sorted(tags - expected)}")
          print(f"{sum(map(len, found.values()))} wheels for {sorted(found)}")
          sys.exit(0 if ok else 1)
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  # Build source distribution
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Build sdist
        run: |
          python -m pip install build
          python -m build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  # Publish to PyPI (only for version tags)
  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-26.04
    # Only publish on version tags (e.g., 1.2.3)
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref, 'test')
    environment:
      name: pypi
      url: https://pypi.org/project/icegrams/
    permissions:
      id-token: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/
          pattern: dist-*
          merge-multiple: true

      - name: List distributions
        run: ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
