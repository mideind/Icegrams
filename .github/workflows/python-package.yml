name: tests

on:
  # Other branches are tested through their pull requests: testing their
  # pushes as well would run every job twice
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "*" ]

jobs:
  # Provides the icegrams-data wheel (the trigram model) for the jobs below:
  # restored from the cache, or built and cached here, once per model (see
  # .github/actions/icegrams-data). The jobs restore it the same way, and
  # build it themselves only if the restore misses (GitHub's cache is
  # eventually consistent).
  prepare-cache:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - name: Provide the icegrams-data wheel
      uses: ./.github/actions/icegrams-data

  build:
    needs: prepare-cache
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: true
      matrix:
        # The same versions as mideind/BinPackage: CPython 3.10+, free-threaded
        # 3.14t and 3.15t, and the PyPy versions that get wheels (wheels.yml)
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "3.14t", "3.15t", "pypy-3.11", "pypy-3.12"]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Provide the icegrams-data wheel
      uses: ./.github/actions/icegrams-data
    # [tool.uv.sources] installs the local icegrams-data subproject, which
    # holds no model; the wheel installed after it replaces it
    - name: Install dependencies
      run: |
        python -m pip install uv
        uv pip install --system --upgrade wheel setuptools pytest packaging
        uv pip install --system -e .
        uv pip install --system dist-data/*.whl
        python -c "import icegrams_data; from icegrams.model import model_filename; assert model_filename() == icegrams_data.model_path(), model_filename()"
    # Linting once is enough
    - name: Lint with ruff
      if: matrix.python-version == '3.10'
      run: |
        uv pip install --system ruff
        ruff check src/icegrams
    - name: Test with pytest
      run: |
        python -m pytest
    # Free-threaded builds: run every test in several threads at once
    - name: Test with pytest in parallel threads
      if: endsWith(matrix.python-version, 't')
      run: |
        uv pip install --system pytest-run-parallel
        python -m pytest --parallel-threads=8

  # The split into icegrams (code) and icegrams-data (the model): build an
  # icegrams wheel and sdist, which hold no model, install the wheel with
  # the icegrams-data wheel into a fresh environment, and run the test
  # suite and the wheel smoke test there. Nothing is published.
  data-package:
    needs: prepare-cache
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Provide the icegrams-data wheel
      uses: ./.github/actions/icegrams-data

    - name: Install uv
      run: python -m pip install uv

    - name: Build an icegrams wheel and sdist without the model
      run: |
        uv build -o dist-code
        ls -l dist-data dist-code
        if unzip -l dist-code/*.whl | grep -q '\.bin$'; then
          echo "The icegrams wheel contains a model file"; exit 1
        fi
        if tar tzf dist-code/*.tar.gz | grep -q '\.bin$'; then
          echo "The icegrams sdist contains a model file"; exit 1
        fi

    - name: Test the two wheels together
      run: |
        uv venv /tmp/split
        uv pip install --python /tmp/split/bin/python dist-data/*.whl dist-code/*.whl pytest
        /tmp/split/bin/python test/wheel_smoke.py
        /tmp/split/bin/python -m pytest -p no:cacheprovider test
