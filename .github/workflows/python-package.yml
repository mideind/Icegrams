name: tests

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.9", "3.13", "3.14", "pypy-3.11"]

    steps:
    - uses: actions/checkout@v4
    # The trigram model is downloaded on first use by the icegrams
    # package itself; cache it between runs. The cache key includes
    # download.py so that a model version bump invalidates the cache.
    - name: Cache the trigrams model
      uses: actions/cache@v4
      with:
        path: ~/.cache/icegrams
        key: icegrams-model-${{ hashFiles('src/icegrams/download.py') }}
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Lint with ruff
      run: |
        python -m pip install uv
        uv pip install --system ruff
        ruff check src/icegrams
    - name: Install dependencies
      run: |
        uv pip install --system --upgrade wheel setuptools pytest packaging
        uv pip install --system -e .
    - name: Test with pytest
      run: |
        python -m pytest
